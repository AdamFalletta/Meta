<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Game Batter Analysis & Statcast HUD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Chakra+Petch:ital,wght@0,500;0,700;1,600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080d16;
            color: #e2e8f0;
            overflow-x: hidden;
            user-select: none;
        }
        .font-teko { font-family: 'Teko', sans-serif; }
        .font-chakra { font-family: 'Chakra Petch', sans-serif; }
        
        .stadium-bg {
            background: linear-gradient(180deg, rgba(5, 10, 20, 0.82) 0%, rgba(10, 18, 32, 0.94) 100%),
                        url('https://images.unsplash.com/photo-1508802279492-472765a07916?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
        }

        .hud-panel {
            background: rgba(12, 20, 36, 0.88);
            border: 2px solid #2a3e5c;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.67), inset 0 0 12px rgba(56, 189, 248, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 8px;
        }

        .hud-header-glow {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }

        .zone-cell {
            transition: all 0.2s ease-in-out;
        }
        .zone-cell:hover {
            transform: scale(1.03);
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .hot-zone { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .avg-zone { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }
        .weak-zone { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .zero-zone { background: linear-gradient(135deg, #475569 0%, #334155 100%); }
    </style>
</head>
<body class="stadium-bg min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const getNyTodayStr = () => {
            const d = new Date();
            return d.toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
        };

        const ALL_MLB_PITCH_TYPES = [
            '4-Seam Fastball', 'Fastball', 'Sinker', 'Cutter', 'Slider', 
            'Sweeper', 'Changeup', 'Splitter', 'Curveball', 'Knuckle Curve', 
            'Slurve', 'Knuckleball', 'Eephus', 'Pitch Out'
        ];

        const parseMlbApiPitches = (gameFeed) => {
            if (!gameFeed?.liveData?.plays?.allPlays) return [];
            
            const pitches = [];
            let pitchCounter = 1;

            gameFeed.liveData.plays.allPlays.forEach((play) => {
                const batterName = play.matchup?.batter?.fullName || 'Unknown Batter';
                const pitcherName = play.matchup?.pitcher?.fullName || 'Unknown Pitcher';
                const pitcherHand = play.matchup?.pitchHand?.code === 'L' ? 'LHP' : 'RHP';
                
                const isTop = play.about?.halfInning === 'top';
                const awayTeam = gameFeed.gameData?.teams?.away?.name || 'Away';
                const homeTeam = gameFeed.gameData?.teams?.home?.name || 'Home';
                const team = isTop ? awayTeam : homeTeam;

                const runners = play.runners || [];
                const isRisp = runners.some(r => r.movement?.originBase === '2B' || r.movement?.originBase === '3B');

                const playEvents = play.playEvents || [];
                playEvents.forEach((evt, idx) => {
                    if (!evt.isPitch) return;

                    const speed = evt.pitchData?.startSpeed || 0;
                    const pitchType = evt.details?.type?.description || evt.details?.type?.code || 'Fastball';
                    const callDesc = (evt.details?.description || '').toLowerCase();
                    const playEventDesc = (play.result?.event || '').toLowerCase();
                    const isLastPitchOfPlay = idx === playEvents.length - 1;

                    let result = 'TAKEN';
                    if (callDesc.includes('in play') || callDesc.includes('hit')) {
                        if (play.result?.type === 'hit' || ['single', 'double', 'triple', 'home run'].some(h => playEventDesc.includes(h))) {
                            result = 'HIT';
                        } else {
                            result = 'OUT';
                        }
                    } else if (callDesc.includes('foul')) {
                        result = 'FOULED';
                    } else if (callDesc.includes('swinging strike') || callDesc.includes('missed') || callDesc.includes('foul tip')) {
                        result = 'MISSED';
                    } else if (callDesc.includes('called strike')) {
                        if (isLastPitchOfPlay && playEventDesc.includes('strikeout')) {
                            result = 'OUT';
                        } else {
                            result = 'TAKEN';
                        }
                    } else if (callDesc.includes('ball') || callDesc.includes('blocked')) {
                        result = 'TAKEN';
                    }

                    let rawZone = evt.pitchData?.zone || 5;
                    let zone = rawZone;
                    if (rawZone > 9) {
                        if (rawZone === 11) zone = 1;
                        else if (rawZone === 12) zone = 3;
                        else if (rawZone === 13) zone = 7;
                        else if (rawZone === 14) zone = 9;
                        else zone = 5;
                    }

                    const x = (zone - 1) % 3;
                    const y = Math.floor((zone - 1) / 3);

                    const countStr = `${evt.count?.balls || 0}-${evt.count?.strikes || 0}`;
                    let situation = 'Bases Empty';
                    if (evt.count?.strikes === 2) situation = '2-Strikes';
                    else if (isRisp) situation = 'Runners in Scoring Position';
                    else if ((evt.count?.balls || 0) > (evt.count?.strikes || 0)) situation = 'Ahead in Count';

                    pitches.push({
                        id: `${play.about?.atBatIndex || 0}-${evt.pitchNumber || pitchCounter++}`,
                        batter: batterName,
                        team: team,
                        pitcher: pitcherName,
                        pitcherHand: pitcherHand,
                        pitchType: pitchType,
                        speed: speed ? parseFloat(speed.toFixed(1)) : 92.0,
                        x: x,
                        y: y,
                        result: result,
                        situation: situation,
                        count: countStr,
                        zone: zone
                    });
                });
            });

            return pitches;
        };

        function App() {
            const [searchDate, setSearchDate] = React.useState(getNyTodayStr());
            const [dateGames, setDateGames] = React.useState([]);
            const [selectedGamePk, setSelectedGamePk] = React.useState('');
            
            const [gameTitle, setGameTitle] = React.useState('Loading MLB Schedule...');
            const [gameStatus, setGameStatus] = React.useState('');
            const [rawPitches, setRawPitches] = React.useState([]);
            const [linescoreData, setLinescoreData] = React.useState(null);
            const [teamsInfo, setTeamsInfo] = React.useState({ away: 'Away', home: 'Home' });
            
            const [currentBattingTeam, setCurrentBattingTeam] = React.useState('');
            const [currentInningHalf, setCurrentInningHalf] = React.useState('TOP');
            const [currentInningNum, setCurrentInningNum] = React.useState(1);
            const [isLoading, setIsLoading] = React.useState(false);
            const [apiError, setApiError] = React.useState(null);
            const [lastUpdatedTime, setLastUpdatedTime] = React.useState('');

            const [nyClockTime, setNyClockTime] = React.useState('');

            const [selectedTeam, setSelectedTeam] = React.useState('AUTO');
            const [selectedBatter, setSelectedBatter] = React.useState('ALL');
            const [selectedPitcherHand, setSelectedPitcherHand] = React.useState('ALL'); 
            const [selectedPitchType, setSelectedPitchType] = React.useState('ALL');
            const [selectedSituation, setSelectedSituation] = React.useState('ALL');
            const [selectedResults, setSelectedResults] = React.useState(['HIT', 'OUT', 'TAKEN', 'FOULED', 'MISSED']);

            const [selectedZone, setSelectedZone] = React.useState(null);
            const [gridMode, setGridMode] = React.useState('BA');
            const [activeTab, setActiveTab] = React.useState('ANALYSIS');

            React.useEffect(() => {
                const updateClock = () => {
                    const now = new Date();
                    setNyClockTime(now.toLocaleTimeString('en-US', { 
                        timeZone: 'America/New_York', 
                        hour12: true, 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        second: '2-digit' 
                    }) + ' ET');
                };
                updateClock();
                const timer = setInterval(updateClock, 1000);
                return () => clearInterval(timer);
            }, []);

            const fetchGamesForDate = React.useCallback(async (date) => {
                try {
                    const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}&timeZone=America/New_York`);
                    const data = await res.json();
                    const games = data.dates?.[0]?.games || [];

                    const formattedGames = games.map(g => {
                        const awayName = g.teams?.away?.team?.name || 'Away';
                        const homeName = g.teams?.home?.team?.name || 'Home';
                        const awayScore = g.teams?.away?.score ?? 0;
                        const homeScore = g.teams?.home?.score ?? 0;
                        const statusState = g.status?.detailedState || '';

                        let label = '';
                        if (statusState === 'Final' || statusState === 'Completed' || statusState.includes('Final') || statusState.includes('Game Over')) {
                            label = `${awayName} ${awayScore} @ ${homeName} ${homeScore} (Final)`;
                        } else if (statusState === 'In Progress' || statusState === 'Live') {
                            label = `${awayName} ${awayScore} @ ${homeName} ${homeScore} (Live - ${statusState})`;
                        } else {
                            let timeStr = 'Scheduled';
                            if (g.gameDate) {
                                try {
                                    const timeObj = new Date(g.gameDate);
                                    timeStr = timeObj.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit' }) + ' ET';
                                } catch (e) {
                                    timeStr = 'Scheduled';
                                }
                            }
                            label = `${awayName} @ ${homeName} (${timeStr})`;
                        }

                        return {
                            id: String(g.gamePk),
                            title: label,
                            status: statusState,
                            date: date
                        };
                    });

                    setDateGames(formattedGames);

                    if (formattedGames.length > 0) {
                        if (!selectedGamePk || !formattedGames.some(g => g.id === selectedGamePk)) {
                            setSelectedGamePk(formattedGames[0].id);
                        }
                    } else {
                        setSelectedGamePk('');
                        setRawPitches([]);
                        setGameTitle(`No MLB Games Scheduled on ${date}`);
                        setLinescoreData(null);
                    }
                } catch (e) {
                    console.error('Failed to fetch MLB schedule:', e);
                }
            }, [selectedGamePk]);

            const fetchGamePitchData = React.useCallback(async (gamePk) => {
                if (!gamePk) return;
                setIsLoading(true);
                setApiError(null);
                try {
                    const res = await fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`);
                    if (!res.ok) throw new Error(`MLB API error: ${res.status}`);
                    const data = await res.json();
                    
                    const parsed = parseMlbApiPitches(data);
                    setRawPitches(parsed);

                    const away = data.gameData?.teams?.away?.name || 'Away';
                    const home = data.gameData?.teams?.home?.name || 'Home';
                    setTeamsInfo({ away, home });

                    const status = data.gameData?.status?.detailedState || 'In Progress';
                    setGameStatus(status);
                    
                    const linescore = data.liveData?.linescore;
                    setLinescoreData(linescore);

                    const isTopInning = linescore?.isTopInning;
                    const currentPlayHalf = data.liveData?.plays?.currentPlay?.about?.halfInning;
                    let currentBatting = away;
                    let inningHalfText = 'TOP';
                    if (isTopInning !== undefined) {
                        currentBatting = isTopInning ? away : home;
                        inningHalfText = isTopInning ? 'TOP' : 'BOT';
                    } else if (currentPlayHalf) {
                        currentBatting = currentPlayHalf === 'top' ? away : home;
                        inningHalfText = currentPlayHalf === 'top' ? 'TOP' : 'BOT';
                    }
                    setCurrentBattingTeam(currentBatting);
                    setCurrentInningHalf(inningHalfText);
                    setCurrentInningNum(linescore?.currentInning || 1);

                    const titleText = `${away} @ ${home}`;
                    setGameTitle(titleText);

                    const nowStr = new Date().toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    setLastUpdatedTime(nowStr);
                } catch (e) {
                    console.error('Error fetching game pitch data:', e);
                    setApiError(e.message || 'Failed to sync with MLB Stats API');
                } finally {
                    setIsLoading(false);
                }
            }, []);

            const activeBattingTeamName = React.useMemo(() => {
                if (selectedBatter !== 'ALL') {
                    const bTeam = rawPitches.find(p => p.batter === selectedBatter)?.team;
                    return bTeam ? `${selectedBatter} (${bTeam})` : selectedBatter;
                }
                if (selectedTeam !== 'ALL' && selectedTeam !== 'AUTO') return selectedTeam;
                return currentBattingTeam ? currentBattingTeam : (teamsInfo.away || 'AWAY TEAM');
            }, [selectedBatter, selectedTeam, currentBattingTeam, teamsInfo, rawPitches]);

            React.useEffect(() => {
                if (searchDate) fetchGamesForDate(searchDate);
            }, [searchDate, fetchGamesForDate]);

            React.useEffect(() => {
                if (selectedGamePk) fetchGamePitchData(selectedGamePk);
            }, [selectedGamePk, fetchGamePitchData]);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    if (selectedGamePk) {
                        fetchGamePitchData(selectedGamePk);
                    }
                }, 8000);
                return () => clearInterval(interval);
            }, [selectedGamePk, fetchGamePitchData]);

            const availableTeams = React.useMemo(() => {
                return Array.from(new Set(rawPitches.map(p => p.team))).filter(Boolean);
            }, [rawPitches]);

            const availableBatters = React.useMemo(() => {
                let filtered = rawPitches;
                const activeTeamFilter = selectedTeam === 'AUTO' ? currentBattingTeam : selectedTeam;
                if (activeTeamFilter && activeTeamFilter !== 'ALL') {
                    filtered = filtered.filter(p => p.team === activeTeamFilter);
                }
                return Array.from(new Set(filtered.map(p => p.batter))).filter(Boolean);
            }, [rawPitches, selectedTeam, currentBattingTeam]);

            const availablePitchTypes = React.useMemo(() => {
                const extracted = Array.from(new Set(rawPitches.map(p => p.pitchType))).filter(Boolean);
                const combined = Array.from(new Set([...extracted, ...ALL_MLB_PITCH_TYPES]));
                return combined.sort();
            }, [rawPitches]);

            const toggleResultFilter = (res) => {
                setSelectedResults(prev => {
                    if (prev.includes(res)) {
                        if (prev.length === 1) return prev;
                        return prev.filter(r => r !== res);
                    } else {
                        return [...prev, res];
                    }
                });
            };

            const filteredPitches = React.useMemo(() => {
                const targetTeam = selectedTeam === 'AUTO' ? currentBattingTeam : selectedTeam;

                return rawPitches.filter(p => {
                    if (targetTeam !== 'ALL' && targetTeam && p.team !== targetTeam) return false;
                    if (selectedBatter !== 'ALL' && p.batter !== selectedBatter) return false;
                    if (selectedPitcherHand !== 'ALL' && p.pitcherHand !== selectedPitcherHand) return false;
                    if (selectedPitchType !== 'ALL' && p.pitchType !== selectedPitchType) return false;
                    if (selectedSituation !== 'ALL' && p.situation !== selectedSituation) return false;
                    if (selectedResults.length > 0 && !selectedResults.includes(p.result)) return false;
                    if (selectedZone !== null && p.zone !== selectedZone) return false;
                    return true;
                });
            }, [rawPitches, selectedTeam, currentBattingTeam, selectedBatter, selectedPitcherHand, selectedPitchType, selectedSituation, selectedResults, selectedZone]);

            const breakdownStats = React.useMemo(() => {
                const total = filteredPitches.length;
                if (total === 0) {
                    return { HIT: { count: 0, ratio: '0%' }, OUT: { count: 0, ratio: '0%' }, TAKEN: { count: 0, ratio: '0%' }, FOULED: { count: 0, ratio: '0%' }, MISSED: { count: 0, ratio: '0%' }, total: 0 };
                }
                const counts = { HIT: 0, OUT: 0, TAKEN: 0, FOULED: 0, MISSED: 0 };
                filteredPitches.forEach(p => {
                    if (counts[p.result] !== undefined) counts[p.result]++;
                });

                return {
                    HIT: { count: counts.HIT, ratio: `${Math.round((counts.HIT / total) * 100)}%` },
                    OUT: { count: counts.OUT, ratio: `${Math.round((counts.OUT / total) * 100)}%` },
                    TAKEN: { count: counts.TAKEN, ratio: `${Math.round((counts.TAKEN / total) * 100)}%` },
                    FOULED: { count: counts.FOULED, ratio: `${Math.round((counts.FOULED / total) * 100)}%` },
                    MISSED: { count: counts.MISSED, ratio: `${Math.round((counts.MISSED / total) * 100)}%` },
                    total: total
                };
            }, [filteredPitches]);

            const zoneMatrixData = React.useMemo(() => {
                const matrix = {};
                for (let z = 1; z <= 9; z++) {
                    const zonePitches = filteredPitches.filter(p => p.zone === z);
                    const hits = zonePitches.filter(p => p.result === 'HIT').length;
                    const outs = zonePitches.filter(p => p.result === 'OUT').length;
                    const misses = zonePitches.filter(p => p.result === 'MISSED').length;
                    const ab = hits + outs;
                    const ba = ab > 0 ? (hits / ab).toFixed(3).replace(/^0/, '') : '.000';
                    const whiffRate = zonePitches.length > 0 ? Math.round((misses / zonePitches.length) * 100) : 0;
                    
                    let temp = 'zero'; 
                    if (ab > 0) {
                        const numBA = hits / ab;
                        if (numBA >= 0.300) temp = 'hot'; 
                        else if (numBA >= 0.200) temp = 'avg'; 
                        else temp = 'weak';
                    } else {
                        temp = 'zero';
                    }

                    matrix[z] = {
                        hits,
                        outs,
                        ab,
                        totalPitches: zonePitches.length,
                        ba: ba === '1.000' ? '1.000' : ba,
                        whiffRate: `${whiffRate}%`,
                        temp
                    };
                }
                return matrix;
            }, [filteredPitches]);

            const matchupSummary = React.useMemo(() => {
                const totalAB = filteredPitches.filter(p => p.result === 'HIT' || p.result === 'OUT').length;
                const totalHits = filteredPitches.filter(p => p.result === 'HIT').length;
                const totalK = filteredPitches.filter(p => p.result === 'MISSED' && p.situation === '2-Strikes').length;
                const avg = totalAB > 0 ? (totalHits / totalAB).toFixed(3).replace(/^0/, '') : '.000';
                
                return {
                    ab: totalAB,
                    hits: totalHits,
                    avg: avg,
                    k: totalK,
                    totalPitches: filteredPitches.length
                };
            }, [filteredPitches]);

            const boxScoreData = React.useMemo(() => {
                const innings = linescoreData?.innings || [];
                const totalInnings = Math.max(9, innings.length);
                const inningCols = Array.from({ length: totalInnings }, (_, i) => i + 1);

                const awayInnings = [];
                const homeInnings = [];

                inningCols.forEach((num) => {
                    const inn = innings.find(i => i.num === num);
                    awayInnings.push(inn?.away?.runs !== undefined ? inn.away.runs : '-');
                    homeInnings.push(inn?.home?.runs !== undefined ? inn.home.runs : '-');
                });

                const awayTotals = {
                    r: linescoreData?.teams?.away?.runs ?? 0,
                    h: linescoreData?.teams?.away?.hits ?? 0,
                    e: linescoreData?.teams?.away?.errors ?? 0
                };

                const homeTotals = {
                    r: linescoreData?.teams?.home?.runs ?? 0,
                    h: linescoreData?.teams?.home?.hits ?? 0,
                    e: linescoreData?.teams?.home?.errors ?? 0
                };

                return {
                    inningCols,
                    awayInnings,
                    homeInnings,
                    awayTotals,
                    homeTotals
                };
            }, [linescoreData]);

            return (
                <div className="min-h-screen pb-12 pt-4 px-2 sm:px-6 max-w-7xl mx-auto flex flex-col justify-between">
                    
                    {/* HEADER / NAVIGATION BAR */}
                    <header className="mb-6 bg-slate-900/90 border-b-2 border-cyan-500/50 rounded-xl p-4 shadow-2xl backdrop-blur-md flex flex-col lg:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-lg bg-gradient-to-tr from-cyan-600 via-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg text-2xl font-teko border border-cyan-400">
                                MLB
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold font-chakra tracking-wide text-cyan-400 uppercase flex items-center gap-2 hud-header-glow">
                                    MLB LIVE STATCAST BATTER HUD
                                    <span className="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-500 px-2 py-0.5 rounded font-mono animate-pulse">
                                        ● LIVE AUTO-SYNC (8s)
                                    </span>
                                </h1>
                                <p className="text-xs text-slate-400 font-sans flex items-center gap-2">
                                    Official MLB Stats API Feed • {gameTitle}
                                    {lastUpdatedTime && <span className="text-cyan-300 font-mono">({lastUpdatedTime})</span>}
                                </p>
                            </div>
                        </div>

                        {/* GAME SELECTOR & ACTIVE CLOCK */}
                        <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto justify-end">
                            
                            <div className="bg-slate-950 border border-cyan-500/60 rounded-lg px-3 py-1 text-center font-mono">
                                <span className="text-[9px] text-cyan-400 font-bold block uppercase tracking-widest">NY CLOCK</span>
                                <span className="text-xs font-bold text-yellow-400">{nyClockTime || '00:00:00 ET'}</span>
                            </div>

                            <div className="flex items-end gap-1.5">
                                <div className="flex flex-col">
                                    <label className="text-[10px] uppercase font-bold text-cyan-300 font-mono tracking-wider">
                                        Game Date (ET)
                                    </label>
                                    <input
                                        type="date"
                                        value={searchDate}
                                        onChange={(e) => setSearchDate(e.target.value)}
                                        className="bg-slate-950 border border-cyan-500/60 text-cyan-200 text-xs font-semibold rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-cyan-400 cursor-pointer"
                                    />
                                </div>
                                <button
                                    onClick={() => setSearchDate(getNyTodayStr())}
                                    className="px-2.5 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-mono font-bold text-xs rounded-lg transition border border-cyan-300 shadow"
                                    title="Reset date to Today"
                                >
                                    TODAY
                                </button>
                            </div>

                            <div className="flex flex-col min-w-[260px]">
                                <label className="text-[10px] uppercase font-bold text-cyan-300 font-mono tracking-wider">
                                    Choose Game ({dateGames.length} Available)
                                </label>
                                <select
                                    value={selectedGamePk}
                                    onChange={(e) => setSelectedGamePk(e.target.value)}
                                    className="bg-slate-950 border border-cyan-500/60 text-cyan-200 text-xs font-semibold rounded-lg px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-cyan-400 hover:border-cyan-400 transition cursor-pointer shadow-inner"
                                >
                                    {dateGames.length > 0 ? (
                                        dateGames.map(g => (
                                            <option key={g.id} value={g.id}>{g.title}</option>
                                        ))
                                    ) : (
                                        <option value="">No MLB Games Scheduled on {searchDate}</option>
                                    )}
                                </select>
                            </div>

                        </div>
                    </header>

                    {apiError && (
                        <div className="mb-4 bg-red-950/80 border border-red-500 text-red-200 text-xs font-mono p-3 rounded-lg flex justify-between items-center">
                            <span>⚠️ {apiError}</span>

                                                >
                                                    {idx + 1}

                                                    <div className="hidden group-hover:block absolute bottom-7 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white text-[10px] p-2 rounded shadow-2xl border border-cyan-400 whitespace-nowrap z-50">
                                                        <div className="font-bold text-cyan-300">{p.batter} vs {p.pitcher}</div>
                                                        <div>{p.pitchType} • {p.speed} MPH</div>
                                                        <div>Count: {p.count} • Result: <span className="font-bold uppercase text-yellow-400">{p.result}</span></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="w-full mt-4 flex flex-wrap justify-center gap-3 text-xs font-mono">
                                        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-emerald-400"></span> Hit</span>
                                        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-red-500"></span> Out</span>
                                        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-cyan-400"></span> Taken</span>
                                        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-yellow-400"></span> Fouled</span>
                                        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-purple-500"></span> Missed</span>
                                    </div>

                                </div>
                            )}

                            {/* PITCHER VS BATTER BREAKDOWN CARD */}
                            <div className="hud-panel p-5">
                                <div className="border-b border-cyan-500/30 pb-2 mb-3 flex justify-between items-center">
                                    <h2 className="text-base font-bold font-chakra text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                                        ⚡ Pitcher vs Batter Head-to-Head Percentage Breakdown
                                    </h2>
                                    <span className="text-xs font-mono text-yellow-400 font-bold">
                                        MATCHUP METRICS
                                    </span>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center font-mono">
                                    <div className="bg-slate-900/80 p-3 rounded border border-slate-800">
                                        <span className="text-[10px] text-slate-400 uppercase block font-semibold">At-Bats (AB)</span>
                                        <span className="text-xl font-bold font-chakra text-white">{matchupSummary.ab}</span>
                                    </div>
                                    <div className="bg-slate-900/80 p-3 rounded border border-slate-800">
                                        <span className="text-[10px] text-slate-400 uppercase block font-semibold">Hits (H)</span>
                                        <span className="text-xl font-bold font-chakra text-emerald-400">{matchupSummary.hits}</span>
                                    </div>
                                    <div className="bg-slate-900/80 p-3 rounded border border-slate-800">
                                        <span className="text-[10px] text-slate-400 uppercase block font-semibold">Batting Avg</span>
                                        <span className="text-xl font-bold font-chakra text-cyan-300">{matchupSummary.avg}</span>
                                    </div>
                                    <div className="bg-slate-900/80 p-3 rounded border border-slate-800">
                                        <span className="text-[10px] text-slate-400 uppercase block font-semibold">Strikeouts (K)</span>
                                        <span className="text-xl font-bold font-chakra text-purple-400">{matchupSummary.k}</span>
                                    </div>
                                </div>

                                <div className="mt-4 pt-3 border-t border-slate-800">
                                    <span className="text-xs font-mono text-slate-400 font-bold block mb-2">
                                        PITCH TYPE DISTRIBUTION & FREQUENCY
                                    </span>
                                    <div className="h-3 w-full bg-slate-950 rounded-full overflow-hidden flex shadow-inner">
                                        {Object.entries(breakdownStats).filter(([k]) => k !== 'total').map(([type, val], idx) => {
                                            const pct = parseInt(val.ratio);
                                            if (pct === 0) return null;
                                            const colors = ['bg-emerald-500', 'bg-red-500', 'bg-cyan-400', 'bg-yellow-400', 'bg-purple-500'];
                                            return (
                                                <div
                                                    key={type}
                                                    style={{ width: `${pct}%` }}
                                                    className={`${colors[idx % colors.length]} h-full transition-all duration-500`}
                                                    title={`${type}: ${val.ratio}`}
                                                ></div>
                                            );
                                        })}
                                    </div>
                                </div>

                            </div>

                        </div>

                    </div>

                    {/* FOOTER BAR */}
                    <footer className="mt-8 text-center text-xs font-mono text-slate-500 border-t border-slate-800/80 pt-4">
                        In-Game Batter Analysis HUD • Powered by Official MLB Stats API (`statsapi.mlb.com`) • Real-time Interactive Statcast Matrix
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
